name: Prepare distributable assets

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, mbstring
          coverage: none
          tools: composer:v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: bun install
      - run: bun run build
      - name: Commit lockfiles and compiled assets to the PR branch
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock bun.lock
          git add -f public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh package distribution artifacts [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi
